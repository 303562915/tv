<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线视频播放器</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #dplayer { width: 100vw; height: 100vh; }

        .info-bar {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 9999;
        }
        .info-bar h3 { margin: 0 0 5px 0; font-size: 16px; }
        .info-bar p { margin: 3px 0; font-size: 12px; opacity: 0.8; }

        /* 选集按钮 */
        .episode-btn {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            z-index: 9999;
            border: 2px solid #667eea;
            transition: all 0.3s;
        }
        .episode-btn:hover {
            background: #667eea;
            transform: scale(1.05);
        }

        /* 选集面板 */
        .episode-panel {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            max-height: 60vh;
            background: rgba(0,0,0,0.95);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 10000;
            transform: translateY(100%);
            transition: transform 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .episode-panel.show {
            transform: translateY(0);
        }
        .episode-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .episode-header h3 {
            color: #fff;
            font-size: 16px;
            margin: 0;
        }
        .close-btn {
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
        }
        .episode-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .episode-item {
            background: rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px 15px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .episode-item:hover {
            background: rgba(255,255,255,0.2);
        }
        .episode-item.active {
            background: #667eea;
            border-color: #fff;
        }

        /* 错误提示 */
        .error-page {
            display: none;
            color: #fff;
            text-align: center;
            padding: 50px 20px;
        }
        .error-page h1 { margin-bottom: 20px; }
        .error-page p { margin: 10px 0; opacity: 0.8; }
        .error-page code {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="info-bar" id="infoBar">
        <h3>📺 加载中...</h3>
        <p>🎬 正在初始化播放器</p>
    </div>
    <div id="dplayer"></div>

    <!-- 选集按钮（动态显示） -->
    <div class="episode-btn" id="episodeBtn" style="display:none;" onclick="toggleEpisodePanel()">
        📋 选集
    </div>

    <!-- 选集面板 -->
    <div class="episode-panel" id="episodePanel">
        <div class="episode-header">
            <h3>选择集数</h3>
            <button class="close-btn" onclick="toggleEpisodePanel()">×</button>
        </div>
        <div class="episode-list" id="episodeList"></div>
    </div>

    <!-- 错误页面 -->
    <div class="error-page" id="errorPage">
        <h1>❌ 错误</h1>
        <p id="errorMessage"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.js"></script>
    <script>
        console.log('========== 播放器初始化开始 ==========');

        // 显示错误页面
        function showError(message) {
            document.getElementById('errorPage').style.display = 'block';
            document.getElementById('errorMessage').innerHTML = message;
            document.getElementById('dplayer').style.display = 'none';
            document.getElementById('infoBar').style.display = 'none';
        }

        // 解析 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('url');
        const videoTitle = urlParams.get('title') || '在线视频';
        const referer = urlParams.get('referer') || '';
        const userAgent = urlParams.get('ua') || 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36';

        // 剧集列表（JSON格式）
        let episodes = [];
        let currentEpisodeIndex = 0;

        try {
            const episodesParam = urlParams.get('episodes');
            if (episodesParam) {
                episodes = JSON.parse(decodeURIComponent(episodesParam));
                currentEpisodeIndex = parseInt(urlParams.get('index') || '0');
            }
        } catch (e) {
            console.warn('解析剧集列表失败:', e);
        }

        console.log('📹 视频地址:', videoUrl);
        console.log('📺 视频标题:', videoTitle);
        console.log('🔗 Referer:', referer);
        console.log('📋 剧集数量:', episodes.length);

        // 检查视频URL
        if (!videoUrl) {
            showError(`
                <p>缺少视频地址参数</p>
                <p style="margin-top: 20px;">使用方法：</p>
                <p><code>index.html?url=视频地址&title=标题</code></p>
                <p style="margin-top: 10px;">示例：</p>
                <p><code>index.html?url=https://xxx.com/video.m3u8&title=测试视频</code></p>
            `);
            throw new Error('缺少视频地址参数');
        }

        // 获取当前页面的代理地址
        const currentPath = window.location.pathname;
        const proxyUrl = currentPath.replace(/index\.html$/, 'video-proxy.php');
        console.log('🌐 代理地址:', proxyUrl);

        let retryCount = 0;
        const MAX_RETRIES = 3;
        let currentMode = 'proxy';  // 远程服务器只用代理模式

        // 构建播放URL
        function buildPlayUrl(url) {
            let fullUrl = proxyUrl + '?url=' + encodeURIComponent(url);
            if (referer) fullUrl += '&referer=' + encodeURIComponent(referer);
            if (userAgent) fullUrl += '&ua=' + encodeURIComponent(userAgent);
            return fullUrl;
        }

        // 更新信息栏
        function updateInfoBar() {
            const infoBar = document.getElementById('infoBar');
            const currentTitle = episodes.length > 0
                ? `${videoTitle} - ${episodes[currentEpisodeIndex].title}`
                : videoTitle;

            infoBar.innerHTML = `
                <h3>📺 ${currentTitle}</h3>
                <p>🎬 M3U8 在线播放</p>
                <p>✅ 远程代理模式</p>
            `;
        }

        // 初始化播放器
        const currentUrl = episodes.length > 0 ? episodes[currentEpisodeIndex].url : videoUrl;
        let playUrl = buildPlayUrl(currentUrl);
        console.log('🎬 播放地址:', playUrl);

        updateInfoBar();

        try {
            const dp = new DPlayer({
                container: document.getElementById('dplayer'),
                video: {
                    url: playUrl,
                    type: 'hls'
                },
                autoplay: true,
                volume: 1.0,
                screenshot: true,
                hotkey: true,
                preload: 'auto',
                lang: 'zh-cn'
            });

            console.log('✅ DPlayer 初始化完成');

            // 监听播放事件
            dp.on('play', function() {
                console.log('▶️ 开始播放');
            });

            dp.on('canplay', function() {
                console.log('✅ 视频可以播放');
                // 3秒后隐藏信息栏
                setTimeout(() => {
                    const infoBar = document.getElementById('infoBar');
                    infoBar.style.transition = 'opacity 0.5s';
                    infoBar.style.opacity = '0';
                    setTimeout(() => infoBar.style.display = 'none', 500);
                }, 3000);
            });

            // 监听播放错误
            dp.on('error', function() {
                console.error('❌ 播放错误');
                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    console.log('🔄 重试次数:', retryCount + '/' + MAX_RETRIES);
                    setTimeout(() => {
                        console.log('🔄 重新加载视频');
                        dp.switchVideo({ url: playUrl, type: 'hls' });
                    }, 2000);
                } else {
                    console.error('❌ 重试次数已达上限');
                    dp.notice('播放失败，请检查视频地址', 5000);
                }
            });

            // 监听播放结束，自动下一集
            dp.on('ended', function() {
                if (episodes.length > 0 && currentEpisodeIndex < episodes.length - 1) {
                    console.log('✅ 当前集播放完毕，3秒后自动播放下一集');
                    dp.notice('3秒后自动播放下一集...', 3000);
                    setTimeout(() => {
                        playEpisode(currentEpisodeIndex + 1);
                    }, 3000);
                } else {
                    console.log('✅ 已播放完所有集数');
                    dp.notice('已播放完所有集数', 3000);
                }
            });

            // 切换集数
            window.playEpisode = function(index) {
                if (index < 0 || index >= episodes.length) return;

                currentEpisodeIndex = index;
                retryCount = 0;

                const episode = episodes[index];
                playUrl = buildPlayUrl(episode.url);

                console.log('🔄 切换到:', episode.title, playUrl);
                dp.notice('正在播放: ' + episode.title, 2000);

                dp.switchVideo({ url: playUrl, type: 'hls' });

                updateInfoBar();
                updateEpisodeList();
                updateEpisodeButton();
            };

            // 切换选集面板
            window.toggleEpisodePanel = function() {
                const panel = document.getElementById('episodePanel');
                panel.classList.toggle('show');
            };

            // 更新选集按钮
            function updateEpisodeButton() {
                const btn = document.getElementById('episodeBtn');
                if (episodes.length > 0) {
                    btn.style.display = 'block';
                    btn.textContent = '📋 选集 (' + (currentEpisodeIndex + 1) + '/' + episodes.length + ')';
                }
            }

            // 渲染选集列表
            function updateEpisodeList() {
                const listEl = document.getElementById('episodeList');
                if (episodes.length === 0) return;

                listEl.innerHTML = episodes.map((ep, index) =>
                    '<div class="episode-item ' + (index === currentEpisodeIndex ? 'active' : '') + '" onclick="playEpisode(' + index + '); toggleEpisodePanel();">' +
                        ep.title +
                    '</div>'
                ).join('');
            }

            // 初始化选集
            if (episodes.length > 0) {
                updateEpisodeButton();
                updateEpisodeList();
            }

            console.log('========== 播放器初始化完成 ==========');

        } catch (error) {
            console.error('❌ 播放器初始化失败:', error);
            showError('播放器初始化失败: ' + error.message);
        }
    </script>
</body>
</html>
