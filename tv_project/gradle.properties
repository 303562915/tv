# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ============================================
# JVM 内存配置 - 增加内存以加快构建速度
# ============================================
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ============================================
# 并行构建 - 显著提升多模块项目构建速度
# ============================================
org.gradle.parallel=true

# ============================================
# 构建缓存 - 重用之前构建的输出
# ============================================
org.gradle.caching=true

# ============================================
# 配置缓存 - 加快配置阶段（实验性功能）
# ============================================
# org.gradle.configuration-cache=true
# 注意：配置缓存可能与某些插件不兼容，如遇问题请禁用

# ============================================
# Kotlin 编译优化
# ============================================
# 启用增量编译
kotlin.incremental=true
kotlin.incremental.java=true

# Kotlin 编译守护进程内存
kotlin.daemon.jvmargs=-Xmx2048m

# Kotlin 代码风格
kotlin.code.style=official

# ============================================
# Android 配置
# ============================================
# 使用 AndroidX
android.useAndroidX=true

# 启用 Jetifier（将旧的 Support 库转换为 AndroidX）
# 如果所有依赖都已迁移到 AndroidX，可以禁用以加快构建
android.enableJetifier=false

# 非传递 R 类 - 减小 R 类大小
android.nonTransitiveRClass=true

# 启用 R8 完整模式（更好的代码优化）
android.enableR8.fullMode=true

# ============================================
# 其他优化
# ============================================
# 按需配置（只配置需要的项目）
org.gradle.configureondemand=false
# 注意：按需配置可能导致某些任务不执行，建议关闭

# 守护进程（默认启用，保持开启以加快构建）
org.gradle.daemon=true

# 文件监视（自动检测文件变化）
org.gradle.vfs.watch=true