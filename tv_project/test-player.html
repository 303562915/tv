<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>局域网投屏测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        
        .info-box h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .info-box ul {
            margin-left: 20px;
            color: #555;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .video-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-left: 10px;
        }
        
        .type-m3u8 {
            background: #e3f2fd;
            color: #1976d2;
        }
        
        .type-mp4 {
            background: #f3e5f5;
            color: #7b1fa2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 局域网投屏测试</h1>
        <p class="subtitle">在手机应用中点击投屏，然后在这里输入播放地址</p>
        
        <div class="input-group">
            <label for="playUrl">播放地址：</label>
            <input type="text" id="playUrl" placeholder="例如: http://192.168.1.100:8888" />
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="openVideo()">🚀 打开播放</button>
            <button class="btn-secondary" onclick="testConnection()">🔍 测试连接</button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="info-box">
            <h3>📋 使用说明</h3>
            <ul>
                <li>确保手机和电脑在同一 WiFi 网络</li>
                <li>在手机应用中播放视频并点击投屏按钮</li>
                <li>选择电脑设备，复制显示的播放地址</li>
                <li>将地址粘贴到上方输入框</li>
                <li>点击"打开播放"按钮</li>
            </ul>
        </div>
        
        <div class="info-box" style="margin-top: 15px; background: #fff3e0; border-left-color: #ff9800;">
            <h3>⚡ 快速测试</h3>
            <ul>
                <li><strong>M3U8 测试：</strong>支持 HLS 流媒体播放</li>
                <li><strong>MP4 测试：</strong>支持直接播放</li>
                <li><strong>请求头：</strong>自动添加 Referer 和 User-Agent</li>
            </ul>
        </div>
    </div>
    
    <script>
        // 从 URL 参数获取播放地址
        const urlParams = new URLSearchParams(window.location.search);
        const autoPlayUrl = urlParams.get('url');
        if (autoPlayUrl) {
            document.getElementById('playUrl').value = autoPlayUrl;
            // 自动播放
            setTimeout(() => openVideo(), 500);
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }
        }
        
        function openVideo() {
            const url = document.getElementById('playUrl').value.trim();
            
            if (!url) {
                showStatus('❌ 请输入播放地址', 'error');
                return;
            }
            
            if (!url.startsWith('http://')) {
                showStatus('❌ 地址格式错误，应该以 http:// 开头', 'error');
                return;
            }
            
            showStatus('✅ 正在打开播放页面...', 'success');
            
            // 在新窗口打开
            window.open(url, '_blank');
        }
        
        async function testConnection() {
            const url = document.getElementById('playUrl').value.trim();
            
            if (!url) {
                showStatus('❌ 请输入播放地址', 'error');
                return;
            }
            
            showStatus('🔍 正在测试连接...', 'success');
            
            try {
                const response = await fetch(url, {
                    method: 'HEAD',
                    mode: 'no-cors'
                });
                
                showStatus('✅ 连接成功！服务器正在运行', 'success');
            } catch (error) {
                showStatus('❌ 连接失败：' + error.message, 'error');
            }
        }
        
        // 支持回车键
        document.getElementById('playUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                openVideo();
            }
        });
    </script>
</body>
</html>
