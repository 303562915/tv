name: Development APK

# 开发版通道（对照 unicanta 的 development-release.yml）：
#   每次 push 到 main / master 都会构建 release APK，并把「当次构建」作为
#   独立命名的资产（TVPlayer-dev-<run_number>.apk）追加到滚动的 dev 预发布
#   Release 上 —— 每次构建都是一个可单独下载的版本，而不是互相覆盖。
#   配置了 KEYSTORE_* Secrets 时出正式签名包，否则自动回退 debug 签名
#   （Gradle 侧逻辑见 app/build.gradle.kts 的 signingConfigs）。

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: development-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish development APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv_project
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK platform 36
        run: |
          set +e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          echo "Android SDK setup finished"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tv_project/**/*.gradle*', 'tv_project/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Build release APK
        env:
          TVPLAYER_STORE_FILE: ${{ github.workspace }}/release.keystore
          TVPLAYER_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TVPLAYER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TVPLAYER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TVPLAYER_DEV_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK and checksums
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # 只打 arm64-v8a 一个 ABI（universal 关闭），正常只有一个产物；
          # 兜底取排序后的第一个，保证 dev Release 上始终只有一个可解析的 APK。
          apk_file=$(ls app/build/outputs/apk/release/*.apk | sort | head -n 1)
          cp "$apk_file" "$GITHUB_WORKSPACE/dist/TVPlayer-dev-${RUN_NUMBER}.apk"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "TVPlayer-dev-${RUN_NUMBER}.apk" > "SHA256SUMS-${RUN_NUMBER}.txt"
          ls -lh

      - name: Skip publication if this is no longer branch HEAD
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${BRANCH}")" ]; then
            echo "is_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_head=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit exists; skipping this publication."
          fi

      - name: Publish rolling dev prerelease
        if: steps.current.outputs.is_head == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' tv_project/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION_NAME" || { echo "versionName not found in build.gradle.kts" >&2; exit 1; }
          DISPLAY_VERSION="$VERSION_NAME"
          cat > RELEASE_NOTES.md <<EOF
          version: $DISPLAY_VERSION
          development-build: $RUN_NUMBER
          Commit: $COMMIT

          开发版（dev $RUN_NUMBER）：由 main 分支自动构建并发布，与稳定版同一签名，可直接覆盖安装。
          版本：$VERSION_NAME · 提交：$COMMIT
          EOF
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev \
              --target "$COMMIT" \
              --title "TV Player 开发版构建" \
              --notes "准备第一个开发版构建。" \
              --prerelease
          fi
          gh release upload dev --clobber \
            "dist/TVPlayer-dev-${RUN_NUMBER}.apk" \
            "dist/SHA256SUMS-${RUN_NUMBER}.txt"
          gh release edit dev \
            --title "TV Player 开发版 $RUN_NUMBER" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
