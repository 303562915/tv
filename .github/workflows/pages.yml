name: Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - '.github/scripts/build-latest-json.sh'
      - '.github/workflows/pages.yml'
  # Build / Development APK 由 GITHUB_TOKEN 触发，不会级联触发 release 事件，
  # 这里直接接上刷新页面数据
  workflow_run:
    workflows:
      - Build
      - Development APK
    types:
      - completed
    # 不按分支过滤：打 v* 标签触发的 Build 跑在 refs/tags/vX.Y.Z 上，
    # 一旦限定 branches 就匹配不到，latest.json 会一直停在旧版本——
    # 稳定渠道的应用内更新因此永远发现不了新正式版。
    # 这里放开分支过滤，任何一次 Build / Development APK 结束都刷新一次页面数据。
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy download page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-latest-json.sh docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
