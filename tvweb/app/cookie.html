<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie 配置管理</title>
    <link rel="stylesheet" href="style.css?v=20261026.1">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <style>
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .message.success {
            background-color: #f0f9ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
        .message.error {
            background-color: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cookie 配置管理</h1>

        <div class="card">
            <h2>当前配置信息</h2>
            <div class="info-group">
                <label>Cookie 内容：</label>
                <div class="info-value">{{ currentCookie }}</div>
            </div>
            <div class="info-group">
                <label>最后更新时间：</label>
                <div class="info-value">{{ updatedAt }}</div>
            </div>
        </div>

        <div class="card">
            <h2>更新 Cookie</h2>
            <div class="form-group">
                <label for="cookieInput">新的 Cookie 值：</label>
                <textarea v-model="cookieInput" rows="5" placeholder="请输入 Cookie 字符串"></textarea>
            </div>
            <button @click="updateCookie" :disabled="loading" class="btn-primary">
                {{ loading ? '更新中...' : '更新 Cookie' }}
            </button>
            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="cookie.js"></script>
</body>
</html>
