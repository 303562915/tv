<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加视频源</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .source-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .source-card h3 {
            color: #495057;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .source-info {
            display: grid;
            gap: 10px;
            margin-bottom: 15px;
        }
        .info-row {
            display: flex;
            font-size: 14px;
        }
        .info-label {
            color: #6c757d;
            width: 100px;
            font-weight: 500;
        }
        .info-value {
            color: #212529;
            flex: 1;
            word-break: break-all;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>添加视频源</h1>
        <p class="subtitle">将闪电资源和茅台资源添加到系统中</p>

        <div class="source-card">
            <h3>📺 闪电资源</h3>
            <div class="source-info">
                <div class="info-row">
                    <span class="info-label">源标识：</span>
                    <span class="info-value">shandian</span>
                </div>
                <div class="info-row">
                    <span class="info-label">源名称：</span>
                    <span class="info-value">闪电资源</span>
                </div>
                <div class="info-row">
                    <span class="info-label">类型：</span>
                    <span class="info-value">API</span>
                </div>
                <div class="info-row">
                    <span class="info-label">接口地址：</span>
                    <span class="info-value">https://xsd.sdzyapi.com/api.php/provide/vod/from/sdm3u8/at/xml</span>
                </div>
                <div class="info-row">
                    <span class="info-label">描述：</span>
                    <span class="info-value">闪电资源 sdm3u8</span>
                </div>
            </div>
        </div>

        <div class="source-card">
            <h3>🍷 茅台资源</h3>
            <div class="source-info">
                <div class="info-row">
                    <span class="info-label">源标识：</span>
                    <span class="info-value">maotai</span>
                </div>
                <div class="info-row">
                    <span class="info-label">源名称：</span>
                    <span class="info-value">茅台资源</span>
                </div>
                <div class="info-row">
                    <span class="info-label">类型：</span>
                    <span class="info-value">API</span>
                </div>
                <div class="info-row">
                    <span class="info-label">接口地址：</span>
                    <span class="info-value">https://caiji.maotaizy.cc/api.php/provide/vod/from/mtm3u8/at/json</span>
                </div>
                <div class="info-row">
                    <span class="info-label">描述：</span>
                    <span class="info-value">茅台资源 mtm3u8</span>
                </div>
            </div>
        </div>

        <button class="btn" onclick="addSources()" id="addBtn">
            添加这两个视频源
        </button>

        <div class="status" id="status"></div>
    </div>

    <script>
        async function addSources() {
            const btn = document.getElementById('addBtn');
            const status = document.getElementById('status');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span>正在添加...';
            status.className = 'status';
            status.style.display = 'none';

            const sources = [
                {
                    source_key: 'shandian',
                    source_name: '闪电资源',
                    source_type: 'API',
                    base_url: 'https://xsd.sdzyapi.com/api.php/provide/vod/from/sdm3u8/at/xml',
                    description: '闪电资源 sdm3u8',
                    sort_order: 10,
                    status: 1
                },
                {
                    source_key: 'maotai',
                    source_name: '茅台资源',
                    source_type: 'API',
                    base_url: 'https://caiji.maotaizy.cc/api.php/provide/vod/from/mtm3u8/at/json',
                    description: '茅台资源 mtm3u8',
                    sort_order: 11,
                    status: 1
                }
            ];

            let successCount = 0;
            let errorCount = 0;
            let messages = [];

            for (const source of sources) {
                try {
                    const response = await fetch('./api/video_sources.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(source)
                    });

                    const result = await response.json();

                    if (result.code === 200) {
                        successCount++;
                        messages.push(`✓ ${source.source_name} 添加成功`);
                    } else {
                        errorCount++;
                        messages.push(`✗ ${source.source_name} 添加失败: ${result.msg}`);
                    }
                } catch (error) {
                    errorCount++;
                    messages.push(`✗ ${source.source_name} 添加失败: ${error.message}`);
                }
            }

            btn.disabled = false;
            btn.innerHTML = '添加这两个视频源';

            if (errorCount === 0) {
                status.className = 'status success';
                status.innerHTML = `<strong>添加成功！</strong><br>${messages.join('<br>')}`;
            } else if (successCount === 0) {
                status.className = 'status error';
                status.innerHTML = `<strong>添加失败！</strong><br>${messages.join('<br>')}`;
            } else {
                status.className = 'status info';
                status.innerHTML = `<strong>部分成功</strong><br>${messages.join('<br>')}`;
            }
        }
    </script>
</body>
</html>
