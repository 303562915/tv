# Gzip 压缩配置
# 将以下内容添加到 Nginx 配置文件中

# 在 http 块中添加：
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;
gzip_min_length 1024;
gzip_disable "msie6";

# 静态资源缓存
location ~* \.(js|css)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
}

location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}